name: tts
on:
  push:
    paths:
      - "script.txt"
      - "generate.py"
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install chatterbox
        run: pip install --quiet chatterbox-tts 2>&1 | tail -3
      - name: Generate
        run: python generate.py 2>&1 | tail -20
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la output.mp3 || exit 1
          gh release delete "voice" --yes --cleanup-tag 2>/dev/null || true
          gh release create "voice" output.mp3 --title "voice" --notes "cloned voice output"
