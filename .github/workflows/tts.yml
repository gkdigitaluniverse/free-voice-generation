name: tts
on:
  push:
    paths:
      - "script.txt"
      - "generate.py"
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # ---- one-time setup, cached between runs ----
      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-chatterbox-${{ runner.os }}-v1

      - name: Cache torch + chatterbox weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-chatterbox-${{ runner.os }}-v1

      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install chatterbox (skips if cached)
        run: pip install --quiet chatterbox-tts 2>&1 | tail -3

      - name: Generate
        run: python generate.py 2>&1 | tail -20

      # ---- result is written back into the repo so it is easy to find ----
      - name: Commit the audio into the repo
        run: |
          ls -la output.mp3 || exit 1
          git config user.email ci@local && git config user.name ci
          git add -f output.mp3 && git commit -m "voice: $(date -u +%Y-%m-%dT%H:%M)" || true
          git push || true

      - name: Also publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "voice" --yes --cleanup-tag 2>/dev/null || true
          gh release create "voice" output.mp3 --title "voice" --notes "cloned voice output"
