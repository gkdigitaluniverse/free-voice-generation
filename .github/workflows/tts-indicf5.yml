name: tts-indicf5
on:
  push:
    paths: ["script.txt","generate_indicf5.py","ref_text.txt"]
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-indicf5-${{ runner.os }}-v1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-indicf5-${{ runner.os }}-v1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install IndicF5
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade pip -q
          pip install -q torch==2.2.0 transformers==4.49.0 accelerate==0.33.0 pydub soundfile safetensors huggingface_hub==0.29.0 scipy==1.13.0 numpy==1.26.4 sentencepiece protobuf==4.25.3
          pip install -q "git+https://github.com/ai4bharat/IndicF5.git" 2>&1 | tail -3
      - name: Generate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python generate_indicf5.py 2>&1 | tail -40
      - name: Commit
        run: |
          ls -la output.mp3 || exit 1
          git config user.email ci@local && git config user.name ci
          git add -f output.mp3 && git commit -m "voice(indicf5): $(date -u +%Y-%m-%dT%H:%M)" || true
          git push || true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "voice" --yes --cleanup-tag 2>/dev/null || true
          gh release create "voice" output.mp3 --title "voice" --notes "IndicF5 output"
