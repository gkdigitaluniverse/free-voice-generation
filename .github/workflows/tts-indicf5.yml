name: tts-indicf5
on:
  push:
    paths: ["script2.txt","generate_indicf5.py","ref_text.txt","run/**"]
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Start log
        run: |
          mkdir -p out && echo "START $(date -u)" > out/STATUS.txt
          git config user.email ci@local && git config user.name ci
          git add -f out/STATUS.txt && git commit -m "status: start" || true
          git push || true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-indicf5-${{ runner.os }}-v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-indicf5-${{ runner.os }}-v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          { python -m pip install --upgrade pip -q
            pip install -q "git+https://github.com/ai4bharat/IndicF5.git" --no-deps
            pip install -q torch==2.2.0 transformers==4.49.0 accelerate==0.33.0 pydub soundfile safetensors huggingface_hub==0.29.0 scipy==1.13.0 numpy==1.26.4 sentencepiece protobuf==4.25.3 torchaudio==2.2.0
            pip install -q "x_transformers>=1.31.14" transformers_stream_generator vocos librosa einops omegaconf matplotlib pandas tqdm pyyaml requests
            python -c "import transformers,torch;print('transformers',transformers.__version__,'torch',torch.__version__)"
            echo "INSTALL OK $(date -u)"
          } >> out/STATUS.txt 2>&1
          git add -f out/STATUS.txt && git commit -m "status: install" || true
          git push || true
      - name: Generate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TORCHDYNAMO_DISABLE: "1"
          TORCH_COMPILE_DISABLE: "1"
        run: |
          set +e
          echo "GENERATE START $(date -u)" >> out/STATUS.txt
          SRC=script2.txt
          [ -f "$SRC" ] || SRC=script.txt
          sed -i "s|SCRIPT_IN=.*|SCRIPT_IN=$SRC|" generate_indicf5.py 2>/dev/null
          python generate_indicf5.py "$SRC" >> out/STATUS.txt 2>&1
          echo "GENERATE EXIT=$? $(date -u)" >> out/STATUS.txt
          ls -la output.mp3 >> out/STATUS.txt 2>&1
          git add -f out/STATUS.txt && git commit -m "status: generate" || true
          git push || true
      - name: Publish audio
        run: |
          ls -la output.mp3 || exit 1
          git add -f output.mp3 && git commit -m "voice(indicf5): $(date -u +%Y-%m-%dT%H:%M)" || true
          git push || true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "voice" --yes --cleanup-tag 2>/dev/null || true
          gh release create "voice" output.mp3 --title "voice" --notes "IndicF5 output"
