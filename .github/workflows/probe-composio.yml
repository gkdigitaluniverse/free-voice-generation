name: probe-composio
on:
  push:
    paths: ["probe/**"]
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          CK: ${{ secrets.COMPOSIO_KEY }}
        run: |
          exec > PROBE-GH.txt 2>&1
          python3 - <<'PY'
          import json, os, urllib.request
          CK=os.environ.get("CK","")
          print("key present:", bool(CK))
          if not CK:
              raise SystemExit("no COMPOSIO_KEY secret")
          U="https://connect.composio.dev/mcp"
          def post(b):
              r=urllib.request.Request(U,data=json.dumps(b).encode(),method="POST",
                headers={"Content-Type":"application/json","Accept":"application/json, text/event-stream","Authorization":"Bearer "+CK})
              raw=urllib.request.urlopen(r,timeout=180).read().decode("utf-8","ignore")
              o=[]
              for l in raw.split("\n"):
                  if l.startswith("data: "):
                      try:o.append(json.loads(l[6:]))
                      except:pass
              return o[-1] if o else {}
          post({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"p","version":"1"}}})
          def call(n,a,i=[10]):
              i[0]+=1
              r=post({"jsonrpc":"2.0","id":i[0],"method":"tools/call","params":{"name":n,"arguments":a}})
              try: return json.loads(r["result"]["content"][0]["text"])
              except Exception: return r
          s=call("COMPOSIO_SEARCH_TOOLS",{"query":"github actions workflow dispatch run logs cache secret repository"})
          d=s.get("data",{})
          print("CONNECTION STATUS:", json.dumps(d.get("toolkit_connection_statuses"))[:1200])
          for r in d.get("results",[]):
              print("PRIMARY:", r.get("primary_tool_slugs"))
              print("RELATED:", r.get("related_tool_slugs"))
          PY
          git config user.email ci@local && git config user.name ci
          git add -f PROBE-GH.txt && git commit -m "probe: composio github tools" || true
          git push || true
