name: tts-f5api
on:
  push:
    paths: ["script2.txt","generate_f5api.py","ref_text.txt","go/**"]
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Start log
        run: |
          mkdir -p out && echo "F5API START $(date -u)" > out/STATUS-F5.txt
          git config user.email ci@local && git config user.name ci
          git add -f out/STATUS-F5.txt && git commit -m "status: f5api start" || true
          git push || true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-indicf5-${{ runner.os }}-v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-indicf5-${{ runner.os }}-v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: |
          set +e
          { python -m pip install --upgrade pip -q
            pip install -q "git+https://github.com/ai4bharat/IndicF5.git"
            pip install -q torchdiffeq matplotlib pandas tqdm pyyaml requests
            echo "INSTALL OK $(date -u)"
          } >> out/STATUS-F5.txt 2>&1
          git add -f out/STATUS-F5.txt && git commit -m "status: f5api install" || true
          git push || true
      - name: Generate via F5TTS api
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          echo "GEN START $(date -u)" >> out/STATUS-F5.txt
          SRC=script2.txt; [ -f "$SRC" ] || SRC=script.txt
          python generate_f5api.py "$SRC" >> out/STATUS-F5.txt 2>&1
          echo "GEN EXIT=$? $(date -u)" >> out/STATUS-F5.txt
          ls -la output.mp3 >> out/STATUS-F5.txt 2>&1
          git add -f out/STATUS-F5.txt && git commit -m "status: f5api generate" || true
          git push || true
      - name: Publish
        run: |
          ls -la output.mp3 || exit 1
          git add -f output.mp3 && git commit -m "voice(f5api): $(date -u +%Y-%m-%dT%H:%M)" || true
          git push || true
