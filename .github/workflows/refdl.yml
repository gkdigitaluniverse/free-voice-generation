name: refdl
on:
  push:
    paths: ["dl/**"]
  workflow_dispatch:
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q --upgrade yt-dlp
      - name: List shorts only
        run: |
          exec > SHORTS.txt 2>&1
          echo "date: $(date -u)"
          echo "yt-dlp: $(yt-dlp --version)"
          for H in explivolt puretechlens insiderforce apnaaischool; do
            echo
            echo "############ @$H ############"
            echo "--- /shorts ---"
            yt-dlp --flat-playlist --playlist-end 8 --print "%(id)s | %(duration)s | %(title)s" \
              --extractor-args "youtube:player_client=web" \
              "https://www.youtube.com/@$H/shorts" 2>&1 | head -10
            echo "exit=$?"
            echo "--- plain handle (in case shorts tab missing) ---"
            yt-dlp --flat-playlist --playlist-end 8 --print "%(id)s | %(duration)s | %(title)s" \
              --extractor-args "youtube:player_client=web" \
              "https://www.youtube.com/@$H" 2>&1 | head -10
            echo "exit=$?"
          done
      - name: Commit
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f SHORTS.txt && git commit -m "refs: shorts listing for 4 channels" || true
          git push || true
