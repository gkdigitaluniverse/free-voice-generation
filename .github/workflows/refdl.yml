name: refdl
on:
  push:
    paths: ["dl/**"]
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -q --upgrade yt-dlp
          yt-dlp --version
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: List videos from the three channels
        run: |
          exec > DL-REPORT.txt 2>&1
          echo "date: $(date -u)"
          echo "yt-dlp: $(yt-dlp --version)"
          for U in "https://www.youtube.com/@explivolt" "https://www.youtube.com/@puretechlens" "https://www.youtube.com/@insiderforce"; do
            echo
            echo "=============== $U ==============="
            for CL in web android ios tv; do
              echo "--- client: $CL ---"
              yt-dlp --flat-playlist --playlist-end 6 \
                --extractor-args "youtube:player_client=$CL" \
                --print "%(id)s | %(duration)s | %(title)s" "$U/videos" 2>&1 | head -12
              RC=${PIPESTATUS[0]}
              echo "exit=$RC"
              if [ "$RC" = "0" ]; then echo "WORKS: $CL"; break; fi
            done
          done
      - name: Commit report
        run: |
          git config user.email ci@local && git config user.name ci
          git add -f DL-REPORT.txt && git commit -m "refdl: channel listing" || true
          git push || true
