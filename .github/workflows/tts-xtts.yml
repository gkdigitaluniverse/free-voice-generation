name: tts-xtts
on:
  push:
    paths: ["script.txt","generate_xtts.py"]
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-xtts-${{ runner.os }}-v1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.local/share/tts
            ~/.cache/torch
          key: hf-xtts-${{ runner.os }}-v1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install XTTS
        run: |
          python -m pip install --upgrade pip -q
          pip install -q "coqui-tts" soundfile numpy 2>&1 | tail -3
      - name: Accept licence and generate
        env:
          COQUI_TOS_AGREED: "1"
        run: python generate_xtts.py 2>&1 | tail -40
      - name: Commit
        run: |
          ls -la output.mp3 || exit 1
          git config user.email ci@local && git config user.name ci
          git add -f output.mp3 && git commit -m "voice(xtts): $(date -u +%Y-%m-%dT%H:%M)" || true
          git push || true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "voice" --yes --cleanup-tag 2>/dev/null || true
          gh release create "voice" output.mp3 --title "voice" --notes "XTTS-v2 output"
